# When you click Publish on a release: update version.json (the app's update check) and the website's version.
name: Release published

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update version.json and the website
        env:
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: node .github/scripts/update-version.mjs
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json website/config.js 2>/dev/null || git add version.json
          git diff --cached --quiet && echo "Nothing changed" || (git commit -m "Release ${{ github.event.release.tag_name }}" && git push)
